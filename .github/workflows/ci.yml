name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  python-checks:
    name: Python lint + tests (${{ matrix.runner }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Lint Python
        run: uv run ruff check .

      - name: Compile Python
        run: uv run python -m py_compile 8_Utils/Python/*.py 9_Firmware/9_2_FPGA/tb/cosim/*.py 9_Firmware/9_2_FPGA/tb/cosim/real_data/golden_reference.py 9_Firmware/9_3_GUI/radar_dashboard.py 9_Firmware/9_3_GUI/radar_protocol.py 9_Firmware/9_3_GUI/smoke_test.py 9_Firmware/9_3_GUI/test_radar_dashboard.py 9_Firmware/tools/uart_capture.py

      - name: Run dashboard tests
        run: uv run pytest 9_Firmware/9_3_GUI/test_radar_dashboard.py -v

  fpga-regression:
    name: FPGA regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install iverilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run regression script
        run: bash run_regression.sh
        working-directory: 9_Firmware/9_2_FPGA

  mcu-tests:
    name: MCU unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run MCU tests
        run: make clean && make all
        working-directory: 9_Firmware/9_1_Microcontroller/tests
