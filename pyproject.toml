[project]
name = "plfm-radar-python"
version = "0.1.0"
description = "Python tooling for the PLFM RADAR project dashboard and co-simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.8",
  "matplotlib>=3.7",
  "numpy>=1.24",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["9_Firmware/9_3_GUI"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "docs",
  "8_Utils/Python",
  "9_Firmware/9_3_GUI/GUI_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"5_Simulations/**/*.py" = ["E501", "E701", "E702", "W293"]
"9_Firmware/9_2_FPGA/tb/cosim/**/*.py" = ["E501", "E701", "E702", "E741", "F841", "W293"]
"9_Firmware/9_3_GUI/v7/**/*.py" = ["E501"]
