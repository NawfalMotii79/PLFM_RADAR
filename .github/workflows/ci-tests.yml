name: AERIS-10 CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: |
          uv run python - <<'PY'
          import py_compile
          from pathlib import Path
          for p in Path(".").rglob("*.py"):
              parts = p.parts
              if "docs" in parts or ".git" in parts or "__pycache__" in parts:
                  continue
              if ".venv" in parts or (parts and parts[0] == "venv"):
                  continue
              if len(parts) >= 2 and parts[0] == "8_Utils" and parts[1] == "Python":
                  continue
              if (
                  len(parts) >= 3
                  and parts[0] == "9_Firmware"
                  and parts[1] == "9_3_GUI"
                  and p.name.startswith("GUI_")
              ):
                  continue
              py_compile.compile(str(p), doraise=True)
          PY
      - run: uv run pytest 9_Firmware/9_3_GUI/test_radar_dashboard.py -v --tb=short

  mcu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: make test
        working-directory: 9_Firmware/9_1_Microcontroller/tests

  fpga-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: bash run_regression.sh
        working-directory: 9_Firmware/9_2_FPGA
